<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d3b24">

<link rel="icon" href="../docs/img/icon-192.png">

<title>Dominó</title>
<link rel="stylesheet" href="../shared/core.css">
<style>
#stage{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 8px 8px}
.dopps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.dopp{background:rgba(0,0,0,.32);border:2px solid transparent;border-radius:12px;padding:5px 10px;text-align:center;font-weight:800;font-size:13px;min-width:86px;max-width:160px}
.dopp .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dopp.t0 .n{color:#bff5d4} .dopp.t1 .n{color:#ffc4c4}
.dopp.vez{border-color:var(--gold);animation:pulse 1.2s infinite}
.dopp .bk{display:flex;justify-content:center;gap:2px;margin-top:4px;flex-wrap:wrap;max-width:140px;margin-inline:auto}
.dopp .bk i{width:9px;height:16px;border-radius:2px;background:linear-gradient(160deg,#2b6e4c,#123d29);border:1px solid #e9e1c8}
.dopp .sub{font-size:11px;color:#cfe;font-weight:700}
.dboard{flex:1;min-height:0;width:100%;position:relative;border-radius:14px;background:radial-gradient(ellipse at center,rgba(255,255,255,.05),rgba(0,0,0,.12));border:1px solid rgba(255,255,255,.08)}
.dboard svg{position:absolute;inset:0;width:100%;height:100%}
.dboard .bone{position:absolute;right:8px;top:6px;font-size:12px;font-weight:800;color:#ffe6a6;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:10px}
.tl .tf{fill:url(#ivory);stroke:#8d846c;stroke-width:.035}
.tl .dv{stroke:#a59c84;stroke-width:.04}
.tl .pp{fill:#1d1d1d}
.tl.last .tf{stroke:var(--gold);stroke-width:.09}
.tl.new{animation:tileIn .45s cubic-bezier(.2,.9,.3,1.3);transform-box:fill-box;transform-origin:center}
@keyframes tileIn{from{opacity:0;transform:scale(1.5)}}
.tl.ghost{cursor:pointer;opacity:.82}
.tl.ghost .tf{fill:#d9ffe8;stroke:var(--nos);stroke-width:.09;stroke-dasharray:.18 .1;animation:ghostP 1s ease-in-out infinite}
@keyframes ghostP{50%{stroke:#fff}}
.endb circle{fill:rgba(0,0,0,.45);stroke:rgba(255,255,255,.35);stroke-width:.05}
.endb text{fill:#ffe6a6;font-weight:900;font-size:.5px;text-anchor:middle;dominant-baseline:central}
.endb.ok circle{fill:rgba(231,180,58,.9);stroke:#fff;animation:endP 1.1s ease-in-out infinite}
.endb.ok text{fill:#3a2600}
@keyframes endP{50%{stroke-width:.14}}
.dstat{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:34px}
.dstat .st{font-size:14px;font-weight:800;color:var(--gold);text-align:center;text-shadow:0 1px 3px #000}
.dstat button{padding:8px 14px;border-radius:10px;border:none;font-weight:900;font-size:14px;cursor:pointer}
.dhand{display:flex;gap:6px;justify-content:center;align-items:flex-end;flex-wrap:nowrap;padding:4px 0 2px;min-height:calc(var(--hw)*2 + 14px)}
.dhand .ht{width:var(--hw);height:calc(var(--hw)*2);padding:0;border:none;background:none;cursor:pointer;transition:transform .15s,opacity .2s,filter .2s;flex:none;border-radius:calc(var(--hw)*.16)}
.dhand .ht svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.dhand .ht.dim{opacity:.5;filter:saturate(.6)}
.dhand .ht.can{box-shadow:0 0 0 3px rgba(231,180,58,.85),0 0 12px rgba(231,180,58,.5)}
.dhand .ht.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--blue),0 8px 14px rgba(0,0,0,.5)}
@media (hover:hover){ .dhand .ht.can:hover{transform:translateY(-8px)} }
.dsc{font-size:14px;font-weight:800;color:#ffe6a6;text-align:center;white-space:nowrap}
.minirow{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.minirow svg{width:18px;height:36px}
.box table td{vertical-align:middle}
</style>

<body>
<script src="../shared/core.js"></script>
<script src="../shared/mesa.js"></script>
<script src="domino-ai.js"></script>
<script>
"use strict";
/* =============================== DOMINÓ ===============================
   Duplo-seis (28 pedras). Pedra = id 0..27 → [a,b] com a ≤ b.
   Mesa: line = pedras da esquerda para a direita {id, l, r, seat};
   center = posição da primeira pedra jogada (as duas "pontas" crescem dela).
   ===================================================================== */
const {T, pips, has, dbl, other} = DominoAI;
const idOf = (a, b) => T.findIndex(t => t[0] === Math.min(a,b) && t[1] === Math.max(a,b));
const tname = id => `[${T[id][0]}|${T[id][1]}]`;
const ends = st => st.line.length ? [st.line[0].l, st.line[st.line.length-1].r] : null;
const fits = (id, e) => !e || has(id, e[0]) || has(id, e[1]);
const canPlay = (st, p) => st.hands[p].some(id => fits(id, ends(st)));
const handPts = h => h.reduce((s, id) => s + pips(id), 0);
const teamOf = (st, s) => st.mode === 'duplas' ? s % 2 : s;
const nmOf = (st, s) => esc(st.names[s]);

function newHand(st){
  const deck = shuffle([...Array(28).keys()]);
  st.hands = Array.from({length:st.n}, () => deck.splice(0, 7));
  st.bone = st.mode === 'ind' ? deck : [];
  st.line = []; st.center = 0; st.last = null; st.passes = 0; st.must = null; st.result = null;
  st.lacks = Array.from({length:st.n}, () => Array(7).fill(false));
  st.opened = Array.from({length:st.n}, () => Array(7).fill(0));
  st.handNo++; st.phase = 'play';
  if(st.starter < 0){
    // primeira mão: carroça mais alta começa (no duplas é sempre a de seis)
    let must = -1, who = -1;
    for(let v=6; v>=0 && who<0; v--){ const id = idOf(v,v); const q = st.hands.findIndex(h => h.includes(id)); if(q >= 0){ must = id; who = q; } }
    if(who < 0){ // ninguém tem carroça (só no individual com monte): pedra mais pesada
      let best = -1; st.hands.forEach((h,q) => h.forEach(id => { const k = pips(id)*10 + T[id][1]; if(k > best){ best = k; must = id; who = q; } }));
    }
    st.starter = who; st.must = must;
  }
  st.turn = st.starter;
}
// passa a vez a partir de "from"; quem não tem pedra passa (ou compra, no individual)
function advance(st, from, ev){
  if(!st.bone.length && !st.hands.some((h,q) => canPlay(st, q))){ endHand(st, 'tranca', -1, ev); return 0; }
  let p = (from + 1) % st.n, passes = 0;
  for(let k=0;k<st.n;k++){
    if(canPlay(st, p) || st.bone.length){ st.turn = p; return passes; }
    const e = ends(st);
    st.lacks[p][e[0]] = true; st.lacks[p][e[1]] = true;
    ev.push({k:'say', seat:p, text:'Passou ✋'}, {k:'log', text:`${nmOf(st, p)} passou (sem ${e[0]} nem ${e[1]}).`},
            {k:'toast', seat:p, text:'Você não tem pedra que sirva: passou.'});
    passes++;
    p = (p + 1) % st.n;
  }
  st.turn = p; return passes;
}
function endHand(st, kind, by, ev){
  const tot = st.hands.map(handPts);
  let win = -1, pts = 0;               // win = dupla (duplas) ou lugar (individual)
  if(st.mode === 'duplas'){
    const A = tot[0] + tot[2], B = tot[1] + tot[3];
    if(kind === 'batida') win = by % 2;
    else win = A < B ? 0 : B < A ? 1 : -1;
    if(win >= 0) pts = win === 0 ? B : A;
  } else {
    if(kind === 'batida') win = by;
    else { const mn = Math.min(...tot), ws = tot.map((t,q) => t === mn ? q : -1).filter(q => q >= 0); if(ws.length === 1) win = ws[0]; }
    if(win >= 0) pts = tot.reduce((a,b) => a+b, 0) - tot[win];
  }
  if(win >= 0) st.scores[win] += pts;
  // quem começa a próxima: quem bateu; na tranca, o vencedor com menos pontos; empate: o próximo
  let next;
  if(kind === 'batida') next = by;
  else if(win < 0) next = (st.starter + 1) % st.n;
  else if(st.mode === 'duplas') next = tot[win] <= tot[win+2] ? win : win + 2;
  else next = win;
  st.starter = next;
  st.result = {kind, by, win, pts, tot, hands:st.hands.map(h => h.slice()), scores:st.scores.slice()};
  st.phase = 'handEnd';
  const who = win < 0 ? '' : st.mode === 'duplas' ? `a dupla de ${nmOf(st, win)} e ${nmOf(st, win+2)}` : nmOf(st, win);
  if(kind === 'batida') ev.push({k:'banner', text:'Bateu!'}, {k:'snd', s:'win'}, {k:'log', text:`<b>${nmOf(st, by)} bateu</b>: ${who} ganha ${pts} pontos.`});
  else ev.push({k:'banner', text:'Trancou!', bad:true}, {k:'snd', s:'alert'},
    {k:'log', text: win < 0 ? 'Jogo trancado e empatado nos pontos: ninguém marca.' : `Jogo trancado: ${who} tem menos pontos na mão e ganha ${pts}.`});
}
function knowledge(st, seat){
  return {n:st.n, team:st.mode === 'duplas', me:seat, hand:st.hands[seat].slice(), ends:ends(st), board:st.line.map(x => x.id),
    counts:st.hands.map(h => h.length), bone:st.bone.length, lacks:st.lacks, opened:st.opened, must:st.turn === seat ? st.must : null,
    armL:st.center, armR:st.line.length - 1 - st.center};
}
const DIFF = {facil:'Fácil', normal:'Normal', dificil:'Difícil'};

Mesa.run({
  id:'domino', name:'Dominó', icon:'🁫', tagline:'Em duplas ou cada um por si',
  options:[
    {key:'modo', label:'Modo', default:'duplas', choices:[['duplas','Duplas (4 jogadores)'],['ind','Individual (2 a 4)']]},
    {key:'jogadores', label:'Jogadores (individual)', default:'2', choices:[['2','2'],['3','3'],['4','4']]},
    {key:'meta', label:'Partida até', default:'100', choices:[['50','50 pontos'],['100','100 pontos'],['200','200 pontos']]},
    {key:'diff', label:'Bot', default:'normal', choices:[['facil','Fácil'],['normal','Normal'],['dificil','Difícil']]}
  ],
  seats: o => o.modo === 'ind' ? clamp(+o.jogadores || 2, 2, 4) : 4,
  team: (s, n, o) => o && o.modo === 'ind' ? null : s % 2,
  seatLabel: (s, n, o) => o && o.modo === 'ind' ? 'Jogador ' + (s+1) : 'Dupla ' + (s % 2 + 1),
  modeLabel: o => (o.modo === 'ind' ? 'INDIVIDUAL' : 'DUPLAS') + ' · ATÉ ' + o.meta + ' · BOT ' + (DIFF[o.diff] || '').toUpperCase(),
  setup(players, o){
    const mode = o.modo === 'ind' ? 'ind' : 'duplas', n = players.length;
    const st = {mode, n, names:players.map(p => p.name), meta:+o.meta || 100, scores:Array(mode === 'duplas' ? 2 : n).fill(0), handNo:0, starter:-1};
    newHand(st);
    return st;
  },
  startEvents(st){ return [{k:'snd', s:'deal'}, {k:'log', text:`Mão 1 — ${nmOf(st, st.turn)} começa com a carroça ${tname(st.must)}.`}]; },
  waiting(st){ return st.phase === 'play' ? [st.turn] : st.phase === 'handEnd' ? [0] : []; },
  over(st){
    if(st.phase !== 'end') return null;
    const mx = Math.max(...st.scores), ws = st.scores.map((s,i) => s === mx ? i : -1).filter(i => i >= 0);
    if(st.mode === 'duplas'){
      const w = ws[0];
      return {winners:[w, w+2], text:`Placar final: <b>${st.scores[0]}</b> × <b>${st.scores[1]}</b> — vitória de ${nmOf(st, w)} e ${nmOf(st, w+2)}.`};
    }
    return {winners:ws, draw:ws.length === st.n, text:'Placar final: ' + st.scores.map((s,i) => `${nmOf(st, i)} <b>${s}</b>`).join(' · ')};
  },
  apply(st, seat, a){
    if(!a) return {ok:false, err:'Jogada inválida.'};
    const ev = [];
    if(st.phase === 'handEnd'){
      if(a.t !== 'next') return {ok:false};
      if(st.scores.some(s => s >= st.meta)){ st.phase = 'end'; return {events:[]}; }
      newHand(st);
      return {events:[{k:'snd', s:'deal'}, {k:'log', text:`Mão ${st.handNo} — começa ${nmOf(st, st.turn)}.`}]};
    }
    if(st.phase !== 'play' || seat !== st.turn) return {ok:false, err:'Não é a sua vez.'};
    const h = st.hands[seat], e = ends(st);
    if(a.t === 'draw'){
      if(st.mode !== 'ind' || !st.bone.length) return {ok:false, err:'Não há monte para comprar.'};
      if(canPlay(st, seat)) return {ok:false, err:'Você tem pedra que encaixa: jogue-a.'};
      st.lacks[seat] = Array(7).fill(false); st.lacks[seat][e[0]] = true; st.lacks[seat][e[1]] = true;
      let k = 0, got = null;
      while(st.bone.length){ const id = st.bone.pop(); h.push(id); k++; if(fits(id, e)){ got = id; break; } }
      ev.push({k:'snd', s:'card'}, {k:'log', text:`${nmOf(st, seat)} comprou ${k} pedra${k > 1 ? 's' : ''}.`}, {k:'say', seat, text:`Comprou ${k}`});
      st.lastDraw = {seat, n:k, id:got};
      if(got == null){                         // monte acabou e nada serve: passa
        ev.push({k:'say', seat, text:'Passou ✋'}, {k:'log', text:`${nmOf(st, seat)} passou.`});
        const ps = advance(st, seat, ev);
        return {events:ev, pause:500 + 800 * (ps + 1)};
      }
      return {events:ev, pause:350};
    }
    if(a.t !== 'play') return {ok:false, err:'Jogada inválida.'};
    const id = a.id;
    if(!Number.isInteger(id) || !h.includes(id)) return {ok:false, err:'Essa pedra não está na sua mão.'};
    if(st.must != null && id !== st.must) return {ok:false, err:`A primeira pedra tem de ser a carroça ${tname(st.must)}.`};
    let side = a.side === 'L' ? 'L' : 'R', outward;
    if(!e){
      st.line.push({id, l:T[id][0], r:T[id][1], seat}); st.center = 0;
      st.opened[seat][T[id][0]]++; if(!dbl(id)) st.opened[seat][T[id][1]]++;
    } else {
      if(!has(id, side === 'L' ? e[0] : e[1])){
        if(has(id, side === 'L' ? e[1] : e[0]) && a.side == null) side = side === 'L' ? 'R' : 'L';
        else return {ok:false, err:'Essa pedra não encaixa nessa ponta.'};
      }
      if(side === 'L'){ outward = other(id, e[0]); st.line.unshift({id, l:outward, r:e[0], seat}); st.center++; }
      else { outward = other(id, e[1]); st.line.push({id, l:e[1], r:outward, seat}); }
      st.opened[seat][outward]++;
    }
    h.splice(h.indexOf(id), 1);
    st.must = null; st.last = {seat, id, side}; st.lastDraw = null;
    ev.push({k:'snd', s:'card'}, {k:'log', text:`${nmOf(st, seat)} jogou ${tname(id)}.`});
    if(dbl(id) && pips(id) >= 10) ev.push({k:'say', seat, text:'Carroça!'});
    if(!h.length){ endHand(st, 'batida', seat, ev); return {events:ev, pause:900}; }
    const ps = advance(st, seat, ev);
    if(st.phase === 'handEnd') return {events:ev, pause:900};
    return {events:ev, pause: ps ? 350 + 850 * ps : 0};
  },
  bot(st, seat, o){
    if(st.phase === 'handEnd') return {t:'next'};
    if(!canPlay(st, seat) && st.bone.length) return {t:'draw'};
    const m = DominoAI.think(knowledge(st, seat), o.diff || 'normal');
    return m ? {t:'play', id:m.id, side:m.side} : {t:'draw'};
  },
  botFallback(st, seat){
    if(st.phase === 'handEnd') return {t:'next'};
    const e = ends(st), id = st.hands[seat].find(x => fits(x, e));
    if(id == null) return {t:'draw'};
    return {t:'play', id, side: !e || has(id, e[0]) ? 'L' : 'R'};
  },
  botDelay(st, s, o){ return st.phase === 'handEnd' ? 5000 : o.diff === 'dificil' ? 300 : 750; },
  view(st, seat){
    const res = st.phase !== 'play' ? st.result : null;
    return {mode:st.mode, n:st.n, names:st.names, meta:st.meta, scores:st.scores, phase:st.phase, turn:st.turn, handNo:st.handNo,
      hand: seat >= 0 && st.hands[seat] ? st.hands[seat].slice().sort((a,b) => T[a][0] - T[b][0] || T[a][1] - T[b][1]) : [],
      counts:st.hands.map(x => x.length), bone:st.bone.length, line:st.line, center:st.center, ends:ends(st), last:st.last,
      must: st.must, lastDraw: st.lastDraw && st.lastDraw.seat === seat ? st.lastDraw : null, result:res};
  },
  topInfo(g, v){
    const me = v.me >= 0 ? v.me : 0;
    if(g.mode === 'duplas') return `<div class="dsc">Nós <span style="color:var(--nos)">${g.scores[me % 2]}</span> × <span style="color:var(--eles)">${g.scores[1 - me % 2]}</span> Eles · até ${g.meta}</div>`;
    return `<div class="dsc">${g.scores.map((s,i) => `<span style="color:${i === me ? 'var(--nos)' : '#fff'}">${esc(i === me ? 'Você' : g.names[i])} ${s}</span>`).join(' · ')} · até ${g.meta}</div>`;
  },
  rules: o => `<h3>Objetivo</h3><p>Ser o primeiro (ou a primeira dupla) a chegar à pontuação da partida — 50, 100 ou 200 pontos.</p>
  <h3>Pedras</h3><p>Dominó <b>duplo-seis</b>: 28 pedras, de [0|0] a [6|6]. Pedras com os dois lados iguais são as <b>carroças</b>.</p>
  <h3>Modo duplas (4 jogadores)</h3><ul><li>O dominó brasileiro clássico: parceiros sentados frente a frente, <b>7 pedras cada</b>, <b>sem compra</b> (todas as pedras são distribuídas).</li>
  <li>Na primeira mão começa quem tem a <b>carroça de seis</b> [6|6], jogando-a. Nas seguintes, começa quem bateu, com <b>qualquer pedra</b>.</li>
  <li>Quem não tem pedra que sirva <b>passa</b> (aparece o aviso "Passou").</li></ul>
  <h3>Modo individual (2 a 4)</h3><ul><li>Cada um por si, <b>7 pedras cada</b>; as que sobram formam o <b>monte</b>.</li>
  <li>Quem não tem pedra que sirva <b>compra do monte</b> até achar uma que encaixe (e joga). Com o monte vazio, passa.</li>
  <li>Na primeira mão começa quem tiver a carroça mais alta; depois, quem bateu. (Com 4 jogadores não sobra monte.)</li></ul>
  <h3>Jogando</h3><ul><li>A mesa tem <b>duas pontas</b>. Na sua vez, encaixe uma pedra que tenha o número de uma das pontas. As carroças ficam <b>atravessadas</b>.</li>
  <li>Toque numa pedra destacada da sua mão. Se ela servir nas duas pontas, toque na ponta (pedra verde) onde quer jogar.</li></ul>
  <h3>Fim da mão e pontos</h3><ul><li><b>Batida</b>: quem fica sem pedras bate. ${o && o.modo === 'ind' ? 'Ele ganha a soma dos pontos das pedras que sobraram na mão dos adversários.' : 'A dupla dele ganha a soma dos pontos das pedras que sobraram nas mãos da dupla adversária.'}</li>
  <li><b>Jogo trancado</b>: quando ninguém consegue jogar. Ganha quem tiver <b>menos pontos na mão</b> (em duplas, a dupla com menos, somando os dois). O vencedor marca os pontos ${o && o.modo === 'ind' ? 'que sobraram nas mãos dos outros' : 'da dupla adversária'}. Empate: ninguém marca.</li>
  <li>Os pontos de uma pedra são a soma das bolinhas (ex.: [5|6] vale 11).</li></ul>
  <h3>Dicas</h3><ul><li>Solte carroças e pedras pesadas cedo.</li><li>Repare em quem passou: ele não tem aqueles números — jogue para trancá-lo.</li><li>Em duplas, não feche o número que o parceiro está puxando.</li></ul>`,
  render(g, v, ui){ drawDomino(g, v, ui); }
});

/* ------------------------------ desenho ------------------------------ */
const PIPS = {0:[], 1:[[.5,.5]], 2:[[.25,.25],[.75,.75]], 3:[[.25,.25],[.5,.5],[.75,.75]], 4:[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],
  5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]], 6:[[.27,.2],[.27,.5],[.27,.8],[.73,.2],[.73,.5],[.73,.8]]};
// pedra num retângulo (unidades): a = metade esquerda/de cima, b = direita/de baixo
function tileSVG(r, cls, extra){
  const vert = r.h > r.w, x = r.x, y = r.y;
  let s = `<g class="tl ${cls || ''}" ${extra || ''}><rect class="tf" x="${x+.04}" y="${y+.04}" width="${r.w-.08}" height="${r.h-.08}" rx=".14"/>`;
  s += vert ? `<line class="dv" x1="${x+.18}" y1="${y+1}" x2="${x+.82}" y2="${y+1}"/>` : `<line class="dv" x1="${x+1}" y1="${y+.18}" x2="${x+1}" y2="${y+.82}"/>`;
  [[r.a, 0], [r.b, 1]].forEach(([v, k]) => {
    const ox = vert ? x : x + k, oy = vert ? y + k : y;
    (PIPS[v] || []).forEach(([px, py]) => { const [qx, qy] = vert ? [px, py] : [py, px]; s += `<circle class="pp" cx="${ox+qx}" cy="${oy+qy}" r=".095"/>`; });
  });
  return s + '</g>';
}
const DEFS = `<defs><linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffef8"/><stop offset="1" stop-color="#e9e1c9"/></linearGradient></defs>`;
/* Layout em serpentina: a primeira pedra no centro; a ponta direita cresce para a direita,
   desce e volta (fazendo "S"); a esquerda é a mesma coisa girada 180°. Carroças atravessadas. */
function layArm(list, sx, Wl){
  const out = [];
  let dir = 1, yc = 0, cur = sx, turned = false;
  for(const t of list){
    let r;
    if(turned && t.dbl){                                    // carroça logo depois da curva: deitada embaixo da curva
      const cx = dir > 0 ? cur + .5 : cur - .5;
      r = {x:cx - 1, y:yc - .5, w:2, h:1, a:t.vin, b:t.vin, near:'a'}; cur = dir > 0 ? cx + 1 : cx - 1;
    } else if(t.dbl){
      r = {x: dir > 0 ? cur : cur - 1, y:yc - 1, w:1, h:2, a:t.vin, b:t.vin, near:'a'}; cur += dir;
    } else if(turned || (dir > 0 ? cur + 2 <= Wl - 1 : cur - 2 >= -(Wl - 1))){
      r = dir > 0 ? {x:cur, y:yc - .5, w:2, h:1, a:t.vin, b:t.vout, near:'a'} : {x:cur - 2, y:yc - .5, w:2, h:1, a:t.vout, b:t.vin, near:'b'};
      cur += 2*dir;
    } else {                                                 // curva: pedra em pé descendo
      const x0 = dir > 0 ? cur : cur - 1;
      r = {x:x0, y:yc - .5, w:1, h:2, a:t.vin, b:t.vout, near:'a'};
      out.push(r); yc += 2; cur = dir > 0 ? x0 + 1 : x0; dir = -dir; turned = true;
      continue;
    }
    turned = false;
    out.push(r);
  }
  return out;
}
const rot = r => ({x:-(r.x + r.w), y:-(r.y + r.h), w:r.w, h:r.h, a:r.b, b:r.a, near: r.near === 'a' ? 'b' : 'a'});
// rects de toda a linha (+ extras opcionais em cada ponta)
function layout(line, center, Wl, extraL, extraR){
  if(!line.length) return {rects:[], L:[], R:[]};
  const c = line[center], cd = c.l === c.r;
  const cr = cd ? {x:-.5, y:-1, w:1, h:2, a:c.l, b:c.r} : {x:-1, y:-.5, w:2, h:1, a:c.l, b:c.r};
  const half = cd ? .5 : 1;
  const rl = []; for(let i=center+1;i<line.length;i++) rl.push({vin:line[i].l, vout:line[i].r, dbl:line[i].l === line[i].r});
  const ll = []; for(let i=center-1;i>=0;i--) ll.push({vin:line[i].r, vout:line[i].l, dbl:line[i].l === line[i].r});
  const R = layArm(rl.concat(extraR || []), half, Wl), L = layArm(ll.concat(extraL || []), half, Wl).map(rot);
  const rects = [];
  for(let i=0;i<center;i++) rects[i] = L[center - 1 - i];
  rects[center] = cr;
  for(let i=center+1;i<line.length;i++) rects[i] = R[i - center - 1];
  return {rects, L, R};
}
function bbox(rs){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  rs.forEach(r => { if(!r) return; x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h); });
  return {x0, y0, x1, y1};
}
// escolhe a largura da serpentina para a mesa caber na área (pensando numa mão cheia)
let WLC = {key:'', wl:10, fx:12, fy:8};
function pickWl(Wpx, Hpx){
  const key = Wpx + 'x' + Hpx; if(WLC.key === key) return WLC;
  const fake = Array.from({length:12}, () => ({vin:1, vout:2, dbl:false}));
  let best = null;
  for(let wl=4; wl<=30; wl++){
    const R = layArm(fake, 1, wl), L = R.map(rot), b = bbox(R.concat(L, [{x:-1, y:-.5, w:2, h:1}]));
    const fx = Math.max(-b.x0, b.x1) + .6, fy = Math.max(-b.y0, b.y1) + .6, sc = Math.min(Wpx / (2*fx), Hpx / (2*fy));
    if(!best || sc > best.sc + .01) best = {sc, wl, fx, fy};
  }
  WLC = {key, wl:best.wl, fx:best.fx, fy:best.fy};
  return WLC;
}

let dsel = -1, lastKey = '';
function playableSides(g, id){
  const e = g.ends;
  if(!e) return (g.must != null && g.must !== id) ? [] : ['R'];
  if(g.must != null && g.must !== id) return [];
  const s = [];
  if(has(id, e[0])) s.push('L');
  if(has(id, e[1]) && !(e[0] === e[1] && s.length)) s.push('R');
  return s;
}
function drawDomino(g, v, ui){
  const st = ui.stage, me = v.me >= 0 ? v.me : 0, n = g.n;
  const myTurn = g.phase === 'play' && v.waiting.includes(me);
  if(!myTurn) dsel = -1;
  if(dsel >= 0 && !g.hand.includes(dsel)) dsel = -1;
  const W = st.clientWidth - 16;
  const hw = Math.floor(clamp((W - 6 * Math.max(g.hand.length, 7)) / Math.max(g.hand.length, 7), 22, 44));
  st.style.setProperty('--hw', hw + 'px');
  // adversários: anterior à esquerda ... próximo à direita
  let opps = '';
  for(let k=n-1;k>=1;k--){
    const q = (me + k) % n, tm = g.mode === 'duplas' ? (q % 2 === me % 2 ? 0 : 1) : 1;
    const lbl = g.mode === 'duplas' ? (q % 2 === me % 2 ? 'parceiro' : 'adversário') : `${g.scores[q]} pts`;
    opps += `<div class="dopp t${tm} ${g.turn === q && g.phase === 'play' ? 'vez' : ''}" data-seat="${q}"><span class="n">${esc(g.names[q])}</span><span class="sub">${lbl}</span>
      <div class="bk">${'<i></i>'.repeat(g.counts[q])}</div></div>`;
  }
  st.innerHTML = `<div class="dopps">${opps}</div><div class="dboard" id="dbd"></div><div class="dstat" id="dst"></div><div class="dhand" id="dh" data-seat="${me}"></div>`;
  // mesa
  const bd = $('#dbd'), bw = bd.clientWidth, bh = bd.clientHeight;
  const P = pickWl(bw, bh);
  const lay = layout(g.line, g.center, P.wl);
  // pontas: onde encaixaria a próxima pedra (pedra genérica) e, se houver seleção, a pedra escolhida
  const sides = dsel >= 0 ? playableSides(g, dsel) : [];
  const ghosts = [], badges = [];
  if(g.ends){
    const e = g.ends;
    const gen = (side, vin) => { const t = [{vin, vout:vin === 0 ? 1 : 0, dbl:false}]; const l2 = side === 'L' ? layout(g.line, g.center, P.wl, t, null).L : layout(g.line, g.center, P.wl, null, t).R; return l2[l2.length - 1]; };
    const canL = myTurn && g.hand.some(id => has(id, e[0])), canR = myTurn && g.hand.some(id => has(id, e[1]));
    [['L', e[0], canL], ['R', e[1], canR]].forEach(([side, val, ok]) => {
      const r = gen(side, val); if(!r) return;
      const hx = r.near === 'a' ? (r.w > r.h ? r.x + .5 : r.x + .5) : (r.w > r.h ? r.x + 1.5 : r.x + .5);
      const hy = r.near === 'a' ? (r.w > r.h ? r.y + .5 : r.y + .5) : (r.w > r.h ? r.y + .5 : r.y + 1.5);
      badges.push({side, val, ok: ok && dsel < 0, x:hx, y:hy, r});
    });
    sides.forEach(side => {
      const vin = side === 'L' ? e[0] : e[1], t = [{vin, vout:other(dsel, vin), dbl:dbl(dsel)}];
      const l2 = side === 'L' ? layout(g.line, g.center, P.wl, t, null).L : layout(g.line, g.center, P.wl, null, t).R;
      ghosts.push({side, r:l2[l2.length - 1]});
    });
  } else if(dsel >= 0 && sides.length){
    const d = dbl(dsel);
    ghosts.push({side:'R', r: d ? {x:-.5, y:-1, w:1, h:2, a:T[dsel][0], b:T[dsel][1]} : {x:-1, y:-.5, w:2, h:1, a:T[dsel][0], b:T[dsel][1]}});
  }
  const all = lay.rects.concat(ghosts.map(x => x.r), badges.map(x => x.r));
  const bb = all.length ? bbox(all) : {x0:-1, y0:-1, x1:1, y1:1};
  const fx = Math.max(P.fx, -bb.x0 + .6, bb.x1 + .6), fy = Math.max(P.fy, -bb.y0 + .6, bb.y1 + .6);
  // mantém a proporção da área (sem distorcer)
  let vx = fx, vy = fy; if(vx / vy < bw / bh) vx = vy * bw / bh; else vy = vx * bh / bw;
  const key = g.handNo + ':' + g.line.length + ':' + (g.last ? g.last.id : '');
  let svg = `<svg viewBox="${-vx} ${-vy} ${2*vx} ${2*vy}" preserveAspectRatio="xMidYMid meet">${DEFS}`;
  g.line.forEach((t, i) => {
    const isLast = g.last && t.id === g.last.id;
    svg += tileSVG(lay.rects[i], (isLast ? 'last ' : '') + (isLast && key !== lastKey ? 'new' : ''));
  });
  if(dsel < 0) badges.forEach(b => { svg += `<g class="endb ${b.ok ? 'ok' : ''}"><circle cx="${b.x}" cy="${b.y}" r=".36"/><text x="${b.x}" y="${b.y + .02}">${b.val}</text></g>`; });
  ghosts.forEach(gh => {
    const r = Object.assign({}, gh.r);
    if(!g.ends){ r.a = T[dsel][0]; r.b = T[dsel][1]; }
    svg += tileSVG(r, 'ghost', `data-side="${gh.side}"`);
  });
  if(!g.line.length && !ghosts.length) svg += `<text x="0" y="0" fill="rgba(255,255,255,.35)" font-size=".6" text-anchor="middle" font-weight="800">${g.phase === 'play' ? (g.must != null ? 'Saída: carroça ' + tname(g.must) : 'Mesa vazia — saída livre') : ''}</text>`;
  bd.innerHTML = svg + '</svg>' + (g.mode === 'ind' ? `<span class="bone">Monte: ${g.bone}</span>` : '');
  lastKey = key;
  $$('#dbd .tl.ghost').forEach(el => el.onclick = () => { const id = dsel; dsel = -1; ui.act({t:'play', id, side:el.dataset.side}); });
  // mão
  const hand = $('#dh');
  hand.innerHTML = g.hand.map(id => {
    const ps = myTurn ? playableSides(g, id) : [];
    const cls = myTurn ? (ps.length ? 'can' : 'dim') : '';
    return `<button class="ht ${cls} ${dsel === id ? 'sel' : ''}" data-id="${id}" title="${tname(id)}"><svg viewBox="0 0 1 2">${DEFS}${tileSVG({x:0, y:0, w:1, h:2, a:T[id][0], b:T[id][1]})}</svg></button>`;
  }).join('');
  $$('#dh .ht').forEach(el => el.onclick = () => {
    const id = +el.dataset.id;
    if(!myTurn){ toast(g.phase === 'play' ? 'Aguarde a sua vez.' : ''); return; }
    const ps = playableSides(g, id);
    if(!ps.length){ toast(g.must != null ? `Comece com a carroça ${tname(g.must)}.` : 'Essa pedra não encaixa em nenhuma ponta.'); return; }
    if(ps.length === 1){ dsel = -1; ui.act({t:'play', id, side:ps[0]}); return; }
    dsel = dsel === id ? -1 : id; ui.rerender();
  });
  // status
  const needDraw = myTurn && g.mode === 'ind' && g.bone > 0 && !g.hand.some(id => playableSides(g, id).length);
  let s = '';
  if(g.phase === 'play'){
    if(myTurn){
      if(needDraw) s = 'Nenhuma pedra serve: compre do monte';
      else if(dsel >= 0) s = 'Escolha a ponta: toque na pedra verde';
      else if(g.must != null) s = `Sua vez: comece com a carroça ${tname(g.must)}`;
      else s = g.line.length ? 'Sua vez: toque numa pedra destacada' : 'Sua vez: saída livre, jogue qualquer pedra';
    } else s = `Vez de ${esc(g.names[g.turn])}…`;
  }
  $('#dst').innerHTML = `<span class="st">${s}</span>` + (needDraw ? `<button class="b-y" id="bDraw">Comprar do monte (${g.bone})</button>` : '')
    + (dsel >= 0 ? `<button class="b-no" id="bL">◀ Ponta ${g.ends[0]}</button><button class="b-no" id="bR">Ponta ${g.ends[1]} ▶</button>` : '');
  if($('#bDraw')) $('#bDraw').onclick = () => ui.act({t:'draw'});
  if($('#bL')) $('#bL').onclick = () => { const id = dsel; dsel = -1; ui.act({t:'play', id, side:'L'}); };
  if($('#bR')) $('#bR').onclick = () => { const id = dsel; dsel = -1; ui.act({t:'play', id, side:'R'}); };
  // fim da mão
  if(g.phase === 'handEnd' && g.result) showHandEnd(g, v, ui);
  else if(modalTag === 'hand') closeModal();
}
const mini = id => `<svg viewBox="0 0 1 2">${tileSVG({x:0, y:0, w:1, h:2, a:T[id][0], b:T[id][1]})}</svg>`;
let shownHand = '';
function showHandEnd(g, v, ui){
  const key = g.handNo + ':' + v.gameNo + ':' + (v.waiting.includes(v.me) ? 1 : 0); if(shownHand === key) return;
  shownHand = key;
  const r = g.result, me = v.me >= 0 ? v.me : 0;
  const nm = q => esc(g.names[q]) + (q === me ? ' (você)' : '');
  let title;
  if(r.kind === 'batida') title = `${nm(r.by)} bateu!`;
  else title = 'Jogo trancado';
  let who;
  if(r.win < 0) who = 'Empate nos pontos: ninguém marca.';
  else if(g.mode === 'duplas') who = `${r.win === me % 2 ? 'Nossa dupla' : 'A dupla adversária'} (${nm(r.win)} e ${nm(r.win + 2)}) ganha <b>${r.pts}</b> pontos.`;
  else who = `${nm(r.win)} ganha <b>${r.pts}</b> pontos.`;
  const rows = r.hands.map((h, q) => `<tr><td>${nm(q)}</td><td><div class="minirow">${h.map(mini).join('') || '—'}</div></td><td><b>${r.tot[q]}</b></td></tr>`).join('');
  const placar = g.mode === 'duplas' ? `Nós <b>${r.scores[me % 2]}</b> × <b>${r.scores[1 - me % 2]}</b> Eles` : r.scores.map((s,q) => `${nm(q)} <b>${s}</b>`).join(' · ');
  const fim = r.scores.some(s => s >= g.meta);
  modal(`<h2>${title}</h2><p>${who}</p><table><tr><th>Jogador</th><th>Pedras na mão</th><th>Pts</th></tr>${rows}</table><p>Placar: ${placar} (até ${g.meta})</p>`,
    v.waiting.includes(me) ? [{label: fim ? 'Ver resultado ▶' : 'Próxima mão ▶', fn:() => ui.act({t:'next'})}] : [{label:'OK'}], 'hand');
}
window.addEventListener('resize', () => { if(Mesa.ui.view && Mesa.ui.view.game) Mesa.ui.rerender(); });
</script>
</body>
