# Gera o APK do app Android a cada atualização e publica em
# https://github.com/FernandoJose-ESDHC/trucoonline/releases/tag/apk
name: App Android (APK)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Embutir os jogos no app
        run: |
          W=android/app/src/main/assets/www
          mkdir -p "$W/docs/img"
          rsync -a --exclude android --exclude .git --exclude .github --exclude docs --exclude '*.md' ./ "$W/"
          cp docs/img/icon-192.png docs/img/icon-512.png "$W/docs/img/"

      - name: Compilar o APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk CentralDeJogos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CentralDeJogos-apk
          path: CentralDeJogos.apk

      - name: Publicar na página de downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: App Android — Central de Jogos
          make_latest: true
          files: CentralDeJogos.apk
          body: |
            📱 **Central de Jogos para Android** — gerado automaticamente a partir do código mais recente.

            1. Baixe o **CentralDeJogos.apk** abaixo pelo celular.
            2. Abra o arquivo e permita "instalar apps desta fonte" quando o Android pedir.
            3. Pronto: os jogos funcionam offline contra bots e online com as salas.

            Versões novas instalam por cima da anterior, sem perder o histórico.
